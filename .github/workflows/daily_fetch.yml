name: Daily data fetch

on:
  schedule:
    # 02:30 UTC = 08:00 IST, weekdays only
    - cron: "30 2 * * 1-5"
  workflow_dispatch:   # allows you to trigger it manually from the Actions tab

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Check out the repo ──────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Need full history so git push works correctly
          fetch-depth: 0

      # ── 2. Set up Python ───────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ── 3. Install only the fetch dependencies (no torch, no streamlit) ───
      - name: Install dependencies
        run: pip install -r requirements-fetch.txt

      # ── 4. Run the fetcher ─────────────────────────────────────────────────
      - name: Fetch headlines and update stock data
        env:
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
        run: python src/fetch_news.py

      # ── 5. Commit and push any changes to data/raw/ ───────────────────────
      # The "|| exit 0" on the commit step means "if there's nothing new to
      # commit (no new headlines today), that's fine — don't fail the job."
      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw/
          git commit -m "Daily data update $(date -u '+%Y-%m-%d')" || exit 0
          git push
